name: Refresh GitHub contribution chart

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh chart + contribution count
        run: node scripts/refresh-github-chart.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/github-contributions.svg src/components/GithubActivity.jsx
          git diff --cached --quiet || git commit -m "chore: refresh GitHub contribution chart"
          git push
